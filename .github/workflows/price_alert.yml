name: 微台價格通知＋定時報價

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python price_alert.py
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: 模擬交易(影子模式，至2026-10-21)
        run: python paper_trader.py
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: 把觸發狀態存回repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch paper_state.json paper_trades.csv
          git add alerts.json quote_checkpoints.json
          [ -s paper_state.json ] && git add paper_state.json
          [ -s paper_trades.csv ] && git add paper_trades.csv
          git diff --quiet --cached || (git commit -m "更新通知/模擬交易狀態" && git pull --rebase -q && git push)
