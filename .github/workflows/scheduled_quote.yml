name: 微台定時報價(手動/補發用)

# 正式排程已經併進price_alert.yml(每5分鐘跑一次，用quote_checkpoints.json自我
# 修復)，這裡只留手動觸發，給KK或AI助理需要補發某個時間點報價時用。

on:
  workflow_dispatch:
    inputs:
      label:
        description: '要送哪一種報價'
        required: true
        default: 'day_close'
        type: choice
        options: [day_close, night_check, night_close]

jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scheduled_quote.py ${{ github.event.inputs.label }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
